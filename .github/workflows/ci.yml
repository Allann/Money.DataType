name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hs.Core.slnx

      # Warnings are errors (Directory.Build.props), so this also enforces the analyzers.
      - name: Build
        run: dotnet build Hs.Core.slnx -c Release --no-restore

      - name: Test with coverage
        run: dotnet test --solution Hs.Core.slnx -c Release --no-build --results-directory TestResults --coverlet --coverlet-output-format cobertura

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura*.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: '+Hs.Core;+Hs.Core.Money'

      - name: Publish coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Hs.Core.slnx -c Release --no-build -o packages

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: packages/*.nupkg

  web:
    name: Showcase web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/web/package-lock.json

      - name: Install
        run: npm ci

      # Includes a check that every code excerpt in the tours still matches the C# source.
      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build
